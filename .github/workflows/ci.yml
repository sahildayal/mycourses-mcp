name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      # Boots the MCP server over stdio and lists its tools. Touches no
      # network and needs no Brightspace session, so it is safe in CI and
      # catches broken tool registrations.
      - name: Tool surface smoke test
        run: node scripts/list-tools.mjs
